server:
  port: 0

spring:
  main:
    banner-mode: off

kafka:
  bootstrap-servers: localhost:9092
  producer:
    properties:
      client.id: stats.aggregator
      key.serializer: org.apache.kafka.common.serialization.StringSerializer
      value.serializer: ru.practicum.kafka.serde.GeneralAvroSerializer
    topics:
      events-similarity: stats.events-similarity.v1
  consumer:
    properties:
      group.id: AggregatorGroup
      key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value.deserializer: ru.practicum.kafka.serde.UserActionDeserializer
      consume.attempt.timeout.ms: 500
      auto-offset-reset: earliest
      enable-auto-commit: false
    topics:
      user-actions: stats.user-actions.v1

logging:
  level:
    "org.apache.kafka": ERROR