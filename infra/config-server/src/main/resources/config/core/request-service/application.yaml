server:
  port: 0

spring:
  main:
    banner-mode: off
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
      jdbc.time_zone: UTC
  sql:
    init.mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6435/request
    username: main
    password: main

grpc:
  client:
    collector:
      address: 'discovery:///collector'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
  server:
    port: 0

logging:
  level:
    org:
      springframework:
        orm:
          jpa: INFO
        transaction: INFO