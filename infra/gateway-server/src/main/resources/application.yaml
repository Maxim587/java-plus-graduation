spring:
  application:
    name: gateway-server
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 20000
        max-attempts: 30
      discovery:
        serviceId: config-server
        enabled: true
      uri: ""
    gateway:
      discovery:
        locator:
          enabled: true
    loadbalancer:
      cache:
        ttl: 2s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
      registry-fetch-interval-seconds: 3
  instance:
    preferIpAddress: true
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"
    leaseRenewalIntervalInSeconds: 10



